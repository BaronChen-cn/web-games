<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>迷宫 · Maze</title>
<script src="../shared/utils.js"></script>
<script src="../shared/storage.js"></script>
<script src="../shared/scoreboard.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080f;--surface:#0e1020;--border:rgba(255,255,255,0.07);
  --text:#e8eaff;--muted:rgba(180,185,230,0.55);--accent:#5b6aff;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:16px 12px 40px;touch-action:none;overflow-x:hidden;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
  font-size:13px;margin-bottom:12px;align-self:flex-start;transition:color .15s;}
a.back:hover{color:var(--text);}
h1{font-size:24px;font-weight:800;margin-bottom:4px;
  background:linear-gradient(90deg,#fff,#a8b0ff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:12px;}
.controls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;}
.btn{padding:7px 16px;border-radius:7px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);cursor:pointer;
  font-size:13px;font-weight:600;transition:all .15s;}
.btn:hover{background:rgba(255,255,255,0.1);}
.btn.active{background:var(--accent);border-color:var(--accent);}
.hint-btn{border-color:rgba(255,215,0,0.3) !important;color:#ffd700 !important;}
.hint-used{opacity:0.4;pointer-events:none;}
.stats{display:flex;gap:20px;font-size:14px;color:var(--muted);margin-bottom:10px;}
.stats span{color:var(--text);font-weight:700;}
.canvas-wrap{position:relative;display:inline-block;}
#mazeCanvas{display:block;border-radius:10px;border:1px solid var(--border);}
#minimap{position:absolute;top:8px;right:8px;border-radius:5px;
  border:1px solid rgba(255,255,255,0.12);opacity:0.88;}
#scoreboard-area{margin-top:12px;width:100%;max-width:500px;}
.tip{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;}
#win-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
  align-items:center;justify-content:center;z-index:10;}
#win-modal.show{display:flex;}
.modal-box{background:#0e1020;border:1px solid rgba(255,255,255,0.1);border-radius:16px;
  padding:28px;text-align:center;max-width:300px;width:90%;}
.modal-box h2{font-size:22px;margin-bottom:8px;}
.modal-box p{color:var(--muted);font-size:14px;margin-bottom:4px;}
.new-record{color:#ffd700;font-size:13px;font-weight:700;margin:8px 0;}
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回游戏中心</a>
<h1>迷宫</h1>
<p class="sub">MAZE · ESCAPE</p>
<div class="controls">
  <button class="btn active" data-diff="easy">简单 11×11</button>
  <button class="btn" data-diff="medium">中等 21×21</button>
  <button class="btn" data-diff="hard">困难 31×31</button>
  <button class="btn" id="newBtn">新迷宫</button>
  <button class="btn hint-btn" id="hintBtn">💡 提示</button>
</div>
<div class="stats">步数：<span id="steps">0</span>&nbsp;&nbsp;用时：<span id="timerEl">00:00</span></div>
<div class="canvas-wrap">
  <canvas id="mazeCanvas"></canvas>
  <canvas id="minimap" width="72" height="72"></canvas>
</div>
<p class="tip">键盘方向键 / WASD · 手机滑动操控</p>
<div id="scoreboard-area"></div>
<div id="win-modal">
  <div class="modal-box">
    <h2>🎉 逃出来了！</h2>
    <p id="win-steps"></p>
    <p id="win-time"></p>
    <div class="new-record" id="win-record" style="display:none">🏆 新纪录！</div>
    <button class="btn" id="win-restart" style="margin-top:16px;width:100%">再来一局</button>
  </div>
</div>
<script>
// ── 难度配置 ──
const DIFFS = {
  easy:   { size: 11 },
  medium: { size: 21 },
  hard:   { size: 31 },
};

const storage  = new GameStorage('maze');
const timerObj = new Timer();
let difficulty = 'easy';
let grid = [];
let playerR = 0, playerC = 0;
let steps = 0;
let hintUsed = false;
let hintPath = [];
let gameOver = false;
let timerInterval = null;
let SIZE = 11;
let CELL = 30;
let animFrame = null;

// 玩家移动尾迹
const TRAIL = [];
const TRAIL_LEN = 10;

// ── 迷宫生成（递归回溯法）──
function generateMaze(size) {
  SIZE = size;
  grid = Array.from({ length: size }, () =>
    Array.from({ length: size }, () => ({
      walls: { N: true, S: true, E: true, W: true },
    }))
  );

  const visited = Array.from({ length: size }, () => Array(size).fill(false));
  const stack = [{ r: 0, c: 0 }];
  visited[0][0] = true;

  const DIRS = [
    { dr: -1, dc:  0, wall: 'N', opp: 'S' },
    { dr:  1, dc:  0, wall: 'S', opp: 'N' },
    { dr:  0, dc: -1, wall: 'W', opp: 'E' },
    { dr:  0, dc:  1, wall: 'E', opp: 'W' },
  ];

  while (stack.length) {
    const cur = stack[stack.length - 1];
    const neighbors = DIRS
      .map(d => ({ r: cur.r + d.dr, c: cur.c + d.dc, wall: d.wall, opp: d.opp }))
      .filter(n => n.r >= 0 && n.r < size && n.c >= 0 && n.c < size && !visited[n.r][n.c]);

    if (!neighbors.length) { stack.pop(); continue; }

    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
    grid[cur.r][cur.c].walls[next.wall] = false;
    grid[next.r][next.c].walls[next.opp] = false;
    visited[next.r][next.c] = true;
    stack.push({ r: next.r, c: next.c });
  }
}

// ── Canvas 尺寸 ──
function initCanvas() {
  const canvas = document.getElementById('mazeCanvas');
  const maxW = Math.min(window.innerWidth - 32, 520);
  const maxH = Math.floor(window.innerHeight * 0.52);
  CELL = Math.max(4, Math.floor(Math.min(maxW, maxH) / SIZE));
  canvas.width = canvas.height = CELL * SIZE;
}

// ── BFS 求解（提示路径）──
function bfsSolve() {
  const prev = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  prev[0][0] = [0, 0];
  const queue = [[0, 0]];
  const DIRS = [[-1,0,'N'],[1,0,'S'],[0,-1,'W'],[0,1,'E']];
  while (queue.length) {
    const [r, c] = queue.shift();
    if (r === SIZE-1 && c === SIZE-1) break;
    DIRS.forEach(([dr, dc, wall]) => {
      const nr = r+dr, nc = c+dc;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) return;
      if (grid[r][c].walls[wall]) return;
      if (prev[nr][nc] !== null) return;
      prev[nr][nc] = [r, c];
      queue.push([nr, nc]);
    });
  }
  const path = [];
  let cur = [SIZE-1, SIZE-1];
  while (prev[cur[0]][cur[1]] && !(cur[0]===0&&cur[1]===0)) {
    path.unshift(cur);
    cur = prev[cur[0]][cur[1]];
  }
  path.unshift([0,0]);
  return path;
}

// ── 绘制迷宫 ──
function drawMaze() {
  const canvas = document.getElementById('mazeCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;

  ctx.fillStyle = '#07080f';
  ctx.fillRect(0, 0, W, W);

  // 提示路径背景
  if (hintPath.length) {
    ctx.fillStyle = 'rgba(91,106,255,0.15)';
    hintPath.forEach(([r,c]) => ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2));
  }

  // 墙体
  ctx.strokeStyle = '#1e2545';
  ctx.lineWidth = Math.max(1, CELL * 0.1);
  ctx.shadowColor = 'rgba(91,106,255,0.3)';
  ctx.shadowBlur = 3;
  ctx.beginPath();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const x = c*CELL, y = r*CELL;
      const w = grid[r][c].walls;
      if (w.N) { ctx.moveTo(x,y); ctx.lineTo(x+CELL,y); }
      if (w.S) { ctx.moveTo(x,y+CELL); ctx.lineTo(x+CELL,y+CELL); }
      if (w.W) { ctx.moveTo(x,y); ctx.lineTo(x,y+CELL); }
      if (w.E) { ctx.moveTo(x+CELL,y); ctx.lineTo(x+CELL,y+CELL); }
    }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 出口脉冲
  const pulse = 0.55 + 0.45 * Math.sin(Date.now() / 320);
  ctx.shadowColor = `rgba(0,212,112,${pulse * 0.8})`;
  ctx.shadowBlur = 10 * pulse;
  ctx.fillStyle = `rgba(0,212,112,${0.45 + 0.35*pulse})`;
  ctx.beginPath();
  ctx.arc((SIZE-0.5)*CELL, (SIZE-0.5)*CELL, CELL*0.35, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 尾迹
  TRAIL.forEach((pos, i) => {
    const alpha = (i+1) / TRAIL_LEN * 0.3;
    ctx.fillStyle = `rgba(91,106,255,${alpha})`;
    const s = CELL * 0.28;
    ctx.beginPath();
    ctx.arc(pos.c*CELL+CELL/2, pos.r*CELL+CELL/2, s, 0, Math.PI*2);
    ctx.fill();
  });

  // 玩家
  ctx.shadowColor = 'rgba(220,230,255,0.9)';
  ctx.shadowBlur = CELL * 0.6;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(playerC*CELL+CELL/2, playerR*CELL+CELL/2, CELL*0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ── 绘制小地图 ──
function drawMinimap() {
  const mm = document.getElementById('minimap');
  const ctx = mm.getContext('2d');
  const S = 72 / SIZE;
  ctx.fillStyle = '#07080f';
  ctx.fillRect(0, 0, 72, 72);
  ctx.fillStyle = '#1e2545';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const w = grid[r][c].walls;
      if (w.E && c < SIZE-1) ctx.fillRect((c+1)*S-0.5, r*S, 1, S);
      if (w.S && r < SIZE-1) ctx.fillRect(c*S, (r+1)*S-0.5, S, 1);
    }
  }
  // 出口
  ctx.fillStyle = '#00d470';
  ctx.fillRect((SIZE-1)*S+1, (SIZE-1)*S+1, S-1, S-1);
  // 玩家
  ctx.fillStyle = '#5b6aff';
  const ps = Math.max(1.5, S * 0.7);
  ctx.beginPath();
  ctx.arc(playerC*S + S/2, playerR*S + S/2, ps, 0, Math.PI*2);
  ctx.fill();
}

// ── 游戏循环 ──
function gameLoop() {
  drawMaze();
  drawMinimap();
  animFrame = requestAnimationFrame(gameLoop);
}

// ── 玩家移动 ──
function move(dr, dc, wall) {
  if (gameOver) return;
  if (grid[playerR][playerC].walls[wall]) return;

  if (!timerObj._running) {
    timerObj.start();
    timerInterval = setInterval(() => {
      document.getElementById('timerEl').textContent = formatTime(timerObj.getElapsed());
    }, 200);
  }

  TRAIL.push({ r: playerR, c: playerC });
  if (TRAIL.length > TRAIL_LEN) TRAIL.shift();

  playerR += dr; playerC += dc;
  steps++;
  document.getElementById('steps').textContent = steps;

  if (playerR === SIZE-1 && playerC === SIZE-1) onWin();
}

const MOVE_MAP = {
  ArrowUp:   [-1,0,'N'], ArrowDown: [1,0,'S'],
  ArrowLeft: [0,-1,'W'], ArrowRight:[0,1,'E'],
  w:[-1,0,'N'], s:[1,0,'S'], a:[0,-1,'W'], d:[0,1,'E'],
  W:[-1,0,'N'], S:[1,0,'S'], A:[0,-1,'W'], D:[0,1,'E'],
};

document.addEventListener('keydown', e => {
  const m = MOVE_MAP[e.key];
  if (m) { e.preventDefault(); move(...m); }
});

// 触屏滑动
let touchX = 0, touchY = 0;
const cvs = document.getElementById('mazeCanvas');
cvs.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });
cvs.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    dx > 0 ? move(0,1,'E') : move(0,-1,'W');
  } else {
    dy > 0 ? move(1,0,'S') : move(-1,0,'N');
  }
});

// ── 胜利 ──
function onWin() {
  gameOver = true;
  timerObj.stop();
  clearInterval(timerInterval);
  cancelAnimationFrame(animFrame);
  drawMaze(); drawMinimap();

  const elapsed = timerObj.getElapsed();
  let newRecord = false;
  if (!hintUsed) {
    const r1 = storage.updateBest(`bestTime_${difficulty}`, elapsed, true);
    const r2 = storage.updateBest(`bestSteps_${difficulty}`, steps, true);
    newRecord = r1 || r2;
  }

  document.getElementById('win-steps').textContent = `步数：${steps}`;
  document.getElementById('win-time').textContent  = `用时：${formatTime(elapsed)}`;
  document.getElementById('win-record').style.display = (newRecord && !hintUsed) ? 'block' : 'none';
  document.getElementById('win-modal').classList.add('show');
  updateScoreboard();
}

function updateScoreboard() {
  const bt = storage.getBest(`bestTime_${difficulty}`);
  const bs = storage.getBest(`bestSteps_${difficulty}`);
  renderScoreboard(document.getElementById('scoreboard-area'), [
    { label: '最快时间', value: bt !== null ? formatTime(bt) : null },
    { label: '最少步数', value: bs !== null ? String(bs) : null },
  ]);
}

// ── 初始化游戏 ──
function initGame(diff) {
  difficulty = diff;
  cancelAnimationFrame(animFrame);
  clearInterval(timerInterval);
  timerObj.reset();
  steps = 0; hintUsed = false; hintPath = []; TRAIL.length = 0;
  playerR = 0; playerC = 0; gameOver = false;

  document.getElementById('steps').textContent = '0';
  document.getElementById('timerEl').textContent = '00:00';
  document.getElementById('hintBtn').classList.remove('hint-used');
  document.getElementById('win-modal').classList.remove('show');

  generateMaze(DIFFS[diff].size);
  initCanvas();
  updateScoreboard();
  gameLoop();
}

// ── 事件绑定 ──
document.querySelectorAll('[data-diff]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initGame(btn.dataset.diff);
  });
});
document.getElementById('newBtn').addEventListener('click', () => initGame(difficulty));
document.getElementById('hintBtn').addEventListener('click', () => {
  if (hintUsed) return;
  hintUsed = true;
  hintPath = bfsSolve();
  document.getElementById('hintBtn').classList.add('hint-used');
});
document.getElementById('win-restart').addEventListener('click', () => initGame(difficulty));
window.addEventListener('resize', () => { if (!gameOver) initCanvas(); });

initGame('easy');
</script>
</body>
</html>
