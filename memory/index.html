<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记忆翻牌 · Memory</title>
<script src="../shared/utils.js"></script>
<script src="../shared/storage.js"></script>
<script src="../shared/scoreboard.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080f;--surface:#0e1020;--border:rgba(255,255,255,0.07);
  --text:#e8eaff;--muted:rgba(180,185,230,0.55);--accent:#5b6aff;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
  font-size:13px;margin-bottom:16px;align-self:flex-start;transition:color .15s;}
a.back:hover{color:var(--text);}
h1{font-size:24px;font-weight:800;margin-bottom:4px;
  background:linear-gradient(90deg,#fff,#a8b0ff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:16px;}
.controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
.btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);cursor:pointer;
  font-size:13px;font-weight:600;transition:all .15s;}
.btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.stats{display:flex;gap:20px;margin-bottom:16px;font-size:14px;color:var(--muted);}
.stats span{color:var(--text);font-weight:700;}
#board{display:grid;gap:10px;margin:0 auto;}
.card{position:relative;cursor:pointer;perspective:600px;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.4,0,.2,1);}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg);}
.card-front,.card-back{position:absolute;inset:0;border-radius:10px;
  display:flex;align-items:center;justify-content:center;backface-visibility:hidden;}
.card-front{background:var(--surface);border:1px solid var(--border);}
.card-front::after{content:'?';font-size:28px;color:var(--muted);}
.card-back{background:#0d1128;border:1px solid rgba(91,106,255,0.3);transform:rotateY(180deg);}
.card.matched .card-back{border-color:rgba(0,212,112,0.5);
  box-shadow:0 0 14px rgba(0,212,112,0.3);}
.card.wrong .card-back{animation:wrongFlash .4s;}
@keyframes wrongFlash{0%,100%{border-color:rgba(91,106,255,0.3)}50%{border-color:rgba(255,60,60,0.7);box-shadow:0 0 12px rgba(255,60,60,0.4);}}
#scoreboard-area{margin-top:16px;width:100%;max-width:500px;}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
  align-items:center;justify-content:center;z-index:10;}
#modal.show{display:flex;}
.modal-box{background:#0e1020;border:1px solid rgba(255,255,255,0.1);border-radius:16px;
  padding:32px;text-align:center;max-width:320px;width:90%;}
.modal-box h2{font-size:22px;margin-bottom:8px;}
.modal-box p{color:var(--muted);font-size:14px;margin-bottom:4px;}
.modal-box .new-record{color:#ffd700;font-size:13px;font-weight:700;margin:8px 0;}
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回游戏中心</a>
<h1>记忆翻牌</h1>
<p class="sub">MEMORY · PIXEL</p>
<div class="controls">
  <button class="btn active" data-diff="easy">简单 4×4</button>
  <button class="btn" data-diff="medium">中等 4×6</button>
  <button class="btn" data-diff="hard">困难 6×6</button>
  <button class="btn" id="restartBtn">重新开始</button>
</div>
<div class="stats">翻牌：<span id="flips">0</span>&nbsp;&nbsp;用时：<span id="timer">00:00</span></div>
<div id="board"></div>
<div id="scoreboard-area"></div>
<div id="modal">
  <div class="modal-box">
    <h2>🎉 过关！</h2>
    <p id="modal-flips"></p>
    <p id="modal-time"></p>
    <div class="new-record" id="modal-record" style="display:none">🏆 新纪录！</div>
    <button class="btn" id="modal-restart" style="margin-top:16px;width:100%">再来一局</button>
  </div>
</div>
<script>

function drawPixelIcon(canvas, icon, cellSize) {
  const ctx = canvas.getContext('2d');
  const scale = cellSize / 16;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.shadowColor = icon.color;
  ctx.shadowBlur = 8 * scale;
  ctx.fillStyle = icon.color;
  icon.pixels.forEach(([x, y]) => {
    ctx.fillRect(x * scale, y * scale, scale - 0.5, scale - 0.5);
  });
  ctx.restore();
}

// ── 难度配置 ──
const DIFFICULTIES = {
  easy:   { cols: 4, rows: 4 },
  medium: { cols: 6, rows: 4 },
  hard:   { cols: 6, rows: 6 },
};

const storage = new GameStorage('memory');
const timerObj = new Timer();
let difficulty = 'easy';
let flips = 0, matched = 0, total = 0;
let first = null, second = null, locked = false;
let timerInterval = null;

function startTimerDisplay() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    document.getElementById('timer').textContent = formatTime(timerObj.getElapsed());
  }, 200);
}
function stopTimerDisplay() { clearInterval(timerInterval); }

// ── 牌面生成与渲染 ──
function buildBoard(diff) {
  const { cols, rows } = DIFFICULTIES[diff];
  const pairs = (cols * rows) / 2;
  const icons = shuffle([...PIXEL_ICONS]).slice(0, pairs);
  const cards = shuffle([...icons, ...icons].map((icon, i) => ({ icon, id: i })));

  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  const maxW = Math.min(window.innerWidth - 32, 500);
  const cellSize = Math.floor((maxW - (cols - 1) * 10) / cols);
  board.style.maxWidth = maxW + 'px';
  board.innerHTML = '';

  cards.forEach((card, idx) => {
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = cellSize;
    drawPixelIcon(cvs, card.icon, cellSize);

    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.dataset.iconIdx = PIXEL_ICONS.indexOf(card.icon);
    el.style.width = el.style.height = cellSize + 'px';
    el.innerHTML = `<div class="card-inner"><div class="card-front"></div><div class="card-back"></div></div>`;
    el.querySelector('.card-back').appendChild(cvs);
    el.addEventListener('click', () => onCardClick(el));
    board.appendChild(el);
  });

  total = cols * rows;
}

// ── 翻牌与匹配逻辑 ──
function onCardClick(el) {
  if (locked || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (!timerObj._running) { timerObj.start(); startTimerDisplay(); }

  el.classList.add('flipped');
  flips++;
  document.getElementById('flips').textContent = flips;

  if (!first) { first = el; return; }
  second = el;
  locked = true;

  if (first.dataset.iconIdx === second.dataset.iconIdx) {
    first.classList.add('matched'); second.classList.add('matched');
    matched += 2;
    first = second = null; locked = false;
    if (matched === total) onWin();
  } else {
    first.classList.add('wrong'); second.classList.add('wrong');
    const a = first, b = second;
    setTimeout(() => {
      a.classList.remove('flipped', 'wrong');
      b.classList.remove('flipped', 'wrong');
      first = second = null; locked = false;
    }, 900);
  }
}

// ── 胜利处理 ──
function onWin() {
  timerObj.stop(); stopTimerDisplay();
  const elapsed = timerObj.getElapsed();
  const isNewTime  = storage.updateBest(`bestTime_${difficulty}`, elapsed, true);
  const isNewFlips = storage.updateBest(`bestFlips_${difficulty}`, flips, true);

  document.getElementById('modal-flips').textContent = `翻牌次数：${flips}`;
  document.getElementById('modal-time').textContent  = `用时：${formatTime(elapsed)}`;
  const rec = document.getElementById('modal-record');
  rec.style.display = (isNewTime || isNewFlips) ? 'block' : 'none';
  document.getElementById('modal').classList.add('show');
  updateScoreboard();
}

function updateScoreboard() {
  const bt = storage.getBest(`bestTime_${difficulty}`);
  const bf = storage.getBest(`bestFlips_${difficulty}`);
  renderScoreboard(document.getElementById('scoreboard-area'), [
    { label: '最快时间', value: bt !== null ? formatTime(bt) : null },
    { label: '最少翻牌', value: bf !== null ? String(bf) : null },
  ]);
}

// ── 初始化与事件绑定 ──
function initGame(diff) {
  difficulty = diff;
  flips = 0; matched = 0; first = null; second = null; locked = false;
  timerObj.reset(); stopTimerDisplay();
  document.getElementById('flips').textContent = '0';
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('modal').classList.remove('show');
  buildBoard(diff);
  updateScoreboard();
}

document.querySelectorAll('[data-diff]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initGame(btn.dataset.diff);
  });
});
document.getElementById('restartBtn').addEventListener('click', () => initGame(difficulty));
document.getElementById('modal-restart').addEventListener('click', () => initGame(difficulty));

initGame('easy');
</script>
